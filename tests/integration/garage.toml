# Single-node Garage for the integration tests (lot 2.7 creates the layout, the key and the bucket).
# The RPC secret and the admin token are not here: compose passes them as GARAGE_RPC_SECRET and
# GARAGE_ADMIN_TOKEN, generated by run.sh at each run. IPv4 binds only: a container without IPv6 would panic.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1

rpc_bind_addr = "0.0.0.0:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "0.0.0.0:3900"
root_domain = ".s3.garage.localhost"

[admin]
api_bind_addr = "0.0.0.0:3903"
