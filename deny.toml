# cargo-deny 0.20.x. Run: cargo deny check
# Kropa is GPL-3.0-or-later. Compatibility is not inferred by the tool: the allow-list
# below is the reviewed translation (docs/quality-release.md §2.2).

[graph]
# Only the platforms we ship: no Windows-only crates in the audit.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]
all-features = true

[licenses]
# Everything not listed is denied, including AGPL-*, GPL-2.0-only, SSPL and unknown licenses.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "LGPL-2.1-or-later",
    "GPL-3.0-or-later",
]
confidence-threshold = 0.93
# The allow-list is intentionally wider than what the tree uses today.
unused-allowed-license = "allow"
# Any exception ([licenses.exceptions] or [[licenses.clarify]]) must be commented here with the crate and the reason.

[advisories]
# RustSec database; a vulnerability, an unsound crate or a yanked version fails the check.
yanked = "deny"
version = 2
# Ignored advisories must carry an id and a justification, e.g.:
# ignore = [{ id = "RUSTSEC-0000-0000", reason = "..." }]
#
# RUSTSEC-2026-0370, -0371 and -0372 (zvariant, zbus_names, zvariant_derive 5.x/4.x): "unmaintained",
# not vulnerabilities; the crates were merged into zbus 6. They come only from `secret-service` 5.2.0
# (zbus 5), the Linux keyring client of `kropa-store` (lot 1.8). The next major, secret-service 6
# (zbus 6), is a release candidate at the time of writing (6.0.0-rc.1, 2026-11-06): take the stable
# release when it is out and remove these three lines. Reviewed by: security-reviewer (to do).
ignore = [
    { id = "RUSTSEC-2026-0370", reason = "zvariant 5 unmaintained (merged into zbus 6); via secret-service 5.2.0 only; no vulnerability" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names 4 unmaintained (merged into zbus 6); via secret-service 5.2.0 only; no vulnerability" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive 5 unmaintained (merged into zbus 6); via secret-service 5.2.0 only; no vulnerability" },
]

[bans]
# Duplicated versions of a crate: warning only.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# crates.io only: no other registry, no git dependency.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
