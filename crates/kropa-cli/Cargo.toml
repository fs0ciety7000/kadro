[package]
name = "kropa"
description = "Kropa command-line client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "kropa_cli"
path = "src/lib.rs"

[[bin]]
name = "kropa"
path = "src/main.rs"

[dependencies]
clap.workspace = true
gethostname.workspace = true
jiff.workspace = true
kropa-capture.workspace = true
kropa-core.workspace = true
kropa-i18n.workspace = true
kropa-upload.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
trycmd.workspace = true
wiremock.workspace = true

# The fake screenshot portal of `tests/portal.rs`: a D-Bus service on a private bus.
[target.'cfg(target_os = "linux")'.dev-dependencies]
kropa-capture = { workspace = true, features = ["test-support"] }
zbus = { workspace = true, features = ["default-rt", "service", "proxy"] }

[lints]
workspace = true
