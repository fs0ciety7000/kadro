<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kropa · maquettes D2.3 révisées</title>
<!-- Aucune ressource externe (D2.3, M19) : pas de Google Fonts, pas d'image distante. Les familles nommées ci-dessous
     (Adwaita Sans, Cantarell, Inter, SF Pro, JetBrains Mono…) ne servent que si elles sont déjà installées sur la machine ;
     sinon le navigateur prend la police système (system-ui, DejaVu…). Le rendu exact dépend donc de la machine ; la
     référence reste le widget natif. -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#E7E9EE;color:#15171C;font:14px/1.45 system-ui,"Adwaita Sans",Cantarell,Inter,"DejaVu Sans",sans-serif}
button{font:inherit;color:inherit}
/* ---------- habillage de la page (hors produit) ---------- */
.doc{position:sticky;top:0;z-index:50;background:#F6F7F9;border-bottom:1px solid #D9DCE2;padding:10px 20px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.doc h1{font:700 17px/1 "Space Grotesk",Inter,sans-serif;display:flex;gap:8px;align-items:center}
.doc h1 small{font:500 12px Inter,sans-serif;color:#5A606B}
.ctl{display:flex;align-items:center;gap:6px;font-size:12px;color:#5A606B}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid #7D8490;border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;background:#fff;color:#15171C;padding:0 11px;min-height:32px;cursor:pointer;border-left:1px solid #D9DCE2;font-size:13px}
.seg button:first-child{border-left:0}
.seg button[aria-pressed=true]{background:#FF8A1F;color:#111318;font-weight:600}
.seg button:focus-visible{outline:2px solid #A84B00;outline-offset:-4px}
main{padding:20px;display:flex;flex-direction:column;align-items:center;gap:16px}
.notes{max-width:1200px;width:100%;background:#fff;border:1px solid #D9DCE2;border-radius:10px;padding:14px 18px;font-size:13.5px}
.notes h2{font:700 15px "Space Grotesk",Inter,sans-serif;margin:4px 0 6px}
.notes ul{padding-left:18px}.notes li{margin:3px 0}
.notes code{font:12.5px "JetBrains Mono",monospace;background:#F0F1F4;padding:0 4px;border-radius:4px}
.hint{font-size:12px;color:#5A606B}
body.sheetmode .doc{display:none}
.sheet{display:grid;grid-template-columns:repeat(2,600px);gap:14px 16px;padding:16px;background:#E7E9EE}
.sheet>h2{grid-column:1/-1;font:700 18px "Space Grotesk",Inter,sans-serif;display:flex;justify-content:space-between;align-items:baseline}
.sheet>h2 small{font:500 12px Inter,sans-serif;color:#5A606B}
.cell{display:flex;flex-direction:column;gap:6px}
.cell figcaption{font:600 12px Inter,sans-serif;color:#2B2F38}
.cell .stage{zoom:.5}

/* ---------- scène ---------- */
.stage{position:relative;width:1200px;height:760px;overflow:hidden;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.25);flex:none;-webkit-font-smoothing:antialiased;font-family:var(--font);font-size:var(--fs);line-height:1.35;text-align:left}
.stage[data-p=adw]{--font:"Adwaita Sans",Cantarell,Inter,system-ui,"DejaVu Sans",sans-serif;--mono:"Adwaita Mono","JetBrains Mono","DejaVu Sans Mono",ui-monospace,monospace;--fs:14.67px;--win-r:12px}
.stage[data-p=mac]{--font:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,"DejaVu Sans",sans-serif;--mono:"SF Mono",ui-monospace,"JetBrains Mono","DejaVu Sans Mono",monospace;--fs:13px;--win-r:10px}
/* jetons natifs imités (la référence reste la feuille de style du système) */
.stage[data-p=adw][data-t=light]{--win:#FAFAFB;--view:#FFFFFF;--hb:#FFFFFF;--card:#FFFFFF;--side:#EBEBED;--dlg:#FFFFFF;--fg:#2E2E32;--muted:#5A606B;--line:rgba(0,0,6,.13);--line2:rgba(0,0,6,.07);--btn:rgba(0,0,6,.08);--btn-h:rgba(0,0,6,.13);--btn-on:rgba(0,0,6,.21);--entry:rgba(0,0,6,.06);--acc-bg:#3584E4;--acc-fg:#FFFFFF;--acc:#0461BE;--err:#C30000;--ok:#1A7F45;--warn:#9C6E03;--shade:rgba(0,0,6,.07);--focus:rgba(53,132,228,.55);--desk:linear-gradient(155deg,#A9BEDB,#6684B2 55%,#3F5D8D)}
.stage[data-p=adw][data-t=dark]{--win:#222226;--view:#1D1D20;--hb:#2E2E32;--card:#333337;--side:#1D1D20;--dlg:#36363A;--fg:#FFFFFF;--muted:#A2A8B3;--line:rgba(255,255,255,.14);--line2:rgba(255,255,255,.07);--btn:rgba(255,255,255,.10);--btn-h:rgba(255,255,255,.15);--btn-on:rgba(255,255,255,.26);--entry:rgba(255,255,255,.08);--acc-bg:#3584E4;--acc-fg:#FFFFFF;--acc:#81D0FF;--err:#FF938C;--ok:#4ADE80;--warn:#FFC252;--shade:rgba(0,0,0,.36);--focus:rgba(53,132,228,.65);--desk:linear-gradient(155deg,#28364F,#141B29)}
.stage[data-p=mac][data-t=light]{--win:#ECECEC;--view:#FFFFFF;--hb:#E6E6E6;--card:#F6F6F6;--side:#E1E1E4;--dlg:#F2F2F2;--fg:#1D1D1F;--muted:#5A606B;--line:rgba(0,0,0,.13);--line2:rgba(0,0,0,.07);--btn:#FFFFFF;--btn-h:#F2F2F2;--btn-on:#FFFFFF;--seg:rgba(0,0,0,.07);--entry:#FFFFFF;--acc-bg:#A84B00;--acc-fg:#FFFFFF;--acc:#A84B00;--err:#C62828;--ok:#1A7F45;--warn:#9C6E03;--shade:rgba(0,0,0,.08);--focus:rgba(168,75,0,.7);--desk:linear-gradient(160deg,#CDBBA8,#8E7C98 55%,#4F5B7E)}
.stage[data-p=mac][data-t=dark]{--win:#2C2C2E;--view:#1E1E1E;--hb:#323234;--card:#363638;--side:#262628;--dlg:#38383A;--fg:#E8E8EA;--muted:#A2A8B3;--line:rgba(255,255,255,.13);--line2:rgba(255,255,255,.07);--btn:#4A4A4E;--btn-h:#555559;--btn-on:#636366;--seg:rgba(255,255,255,.08);--entry:#1E1E1E;--acc-bg:#B85400;--acc-fg:#FFFFFF;--acc:#FF8A1F;--err:#FF6B6B;--ok:#4ADE80;--warn:#FFC252;--shade:rgba(0,0,0,.4);--focus:rgba(255,138,31,.75);--desk:linear-gradient(160deg,#3B3346,#1B2132)}
/* jetons Kropa (surfaces qui nous appartiennent : overlay, outil actif, miniature, icônes) */
.stage[data-t=light]{--k-bg:#F6F7F9;--k-surface:#FFFFFF;--k-raised:#F0F1F4;--k-line:#D9DCE2;--k-line-strong:#7D8490;--k-text:#15171C;--k-muted:#5A606B;--k-accent:#FF8A1F;--k-on-accent:#111318;--k-accent-text:#A84B00;--k-success:#1A7F45;--k-danger:#C62828;--k-hud-sh:0 8px 24px rgba(17,19,24,.28),0 0 0 1px rgba(17,19,24,.10)}
.stage[data-t=dark]{--k-bg:#111318;--k-surface:#1A1D24;--k-raised:#262A33;--k-line:#3A3F4A;--k-line-strong:#7A818D;--k-text:#ECEEF2;--k-muted:#A2A8B3;--k-accent:#FF8A1F;--k-on-accent:#111318;--k-accent-text:#FF8A1F;--k-success:#4ADE80;--k-danger:#FF6B6B;--k-hud-sh:0 8px 24px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.08)}

.desk{position:absolute;inset:0;background:var(--desk)}
.cap{position:absolute;font:600 11.5px/1.35 Inter,sans-serif;color:#fff;background:rgba(17,19,24,.72);padding:3px 8px;border-radius:6px;letter-spacing:.01em;max-width:560px;z-index:5}
.muted{color:var(--muted)}.small{font-size:.86em}
.mono{font-family:var(--mono);font-size:.92em}
.ic{width:16px;height:16px;flex:none}
.stage code{font-family:var(--mono);font-size:.9em;background:var(--btn);padding:1px 5px;border-radius:4px}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;display:inline-block;animation:sp .9s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none;border-right-color:currentColor;opacity:.6}}

/* ---------- fenêtres ---------- */
.win{position:absolute;display:flex;flex-direction:column;background:var(--win);color:var(--fg);border-radius:var(--win-r);overflow:hidden}
.stage[data-p=adw] .win{box-shadow:0 0 0 1px rgba(0,0,6,.08),0 2px 6px rgba(0,0,6,.12),0 12px 32px rgba(0,0,6,.2)}
.stage[data-p=adw][data-t=dark] .win{box-shadow:0 0 0 1px rgba(0,0,0,.7),0 12px 32px rgba(0,0,0,.45)}
.stage[data-p=mac] .win{box-shadow:0 0 0 .5px rgba(0,0,0,.28),0 22px 50px rgba(0,0,0,.32)}
.stage[data-p=mac][data-t=dark] .win{box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 0 0 .5px #000,0 22px 50px rgba(0,0,0,.55)}
.tb{flex:none;position:relative;display:flex;align-items:center;gap:6px;background:var(--hb)}
.stage[data-p=adw] .tb{height:47px;padding:0 6px}
.stage[data-p=mac] .tb{height:52px;padding:0 10px 0 0;border-bottom:1px solid var(--line)}
.tb .s,.tb .e{display:flex;align-items:center;gap:6px;z-index:1}
.tb .e{margin-left:auto}
.ttl{display:flex;flex-direction:column;line-height:1.25;white-space:nowrap;overflow:hidden;min-width:0}
.ttl b{font-weight:700}.ttl small{font-size:.82em;color:var(--muted)}
.stage[data-p=adw] .ttl{position:absolute;inset:0;align-items:center;justify-content:center;pointer-events:none}
.stage[data-p=adw] .ttl>*{pointer-events:auto;max-width:100%;overflow:hidden;text-overflow:ellipsis}
/* fenêtre étroite : AdwHeaderBar décale le titre plutôt que de le laisser chevaucher les boutons */
.stage[data-p=adw] .win.minw .ttl{left:84px;right:318px}
.stage[data-p=mac] .lights{order:0}.stage[data-p=mac] .ttl{order:1;margin-left:4px}.stage[data-p=mac] .tb .s{order:2;margin-left:12px}.stage[data-p=mac] .tb .e{order:3}
.stage[data-p=mac] .ttl small{font-size:11px}
.lights{display:none}
.stage[data-p=mac] .lights{display:flex;gap:8px;padding:0 10px 0 20px}
.lights i{width:12px;height:12px;border-radius:50%;background:#FF5F57;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.2)}
.lights i:nth-child(2){background:#FEBC2E}.lights i:nth-child(3){background:#28C840}
.stage[data-p=mac] .gclose{display:none!important}
.stage[data-p=mac] .win.prefs .tb{height:62px}
.stage[data-p=mac] .win.prefs .ttl{position:absolute;inset:0;align-items:center;justify-content:center;margin:0}

/* boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;cursor:default;white-space:nowrap;color:var(--fg);background:var(--btn)}
.stage[data-p=adw] .btn{min-height:34px;min-width:34px;padding:0 12px;border-radius:6px;font-weight:700}
.stage[data-p=adw] .btn.flat{background:transparent}
.stage[data-p=adw] .btn.icon{padding:0;width:34px}
.stage[data-p=adw] .btn.pill{border-radius:999px;min-height:42px;padding:0 30px}
.stage[data-p=adw] .btn.gclose{width:24px;min-width:24px;min-height:24px;height:24px;border-radius:50%;padding:0;margin:0 7px 0 4px;background:var(--btn)}
.stage[data-p=adw] .gclose .ic{width:12px;height:12px}
.stage[data-p=mac] .btn{height:24px;padding:0 12px;border-radius:6px;font-size:13px;box-shadow:0 0 0 .5px rgba(0,0,0,.2),0 .5px 1.5px rgba(0,0,0,.14)}
.stage[data-p=mac][data-t=dark] .btn{box-shadow:inset 0 .5px rgba(255,255,255,.14),0 0 0 .5px rgba(0,0,0,.55)}
.stage[data-p=mac] .btn.flat{background:transparent;box-shadow:none}
.stage[data-p=mac] .btn.icon{padding:0;width:28px}
.stage[data-p=mac] .btn.pill{height:28px;padding:0 18px}
.stage[data-p=mac] .tb .btn{height:28px;min-width:28px;padding:0 9px;background:transparent;box-shadow:none}
.stage[data-p=mac] .tb .btn.boxed{background:var(--btn);box-shadow:0 0 0 .5px rgba(0,0,0,.2),0 .5px 1.5px rgba(0,0,0,.14)}
.stage[data-p=mac] .tb .btn.icon{width:32px;padding:0}
.btn.primary,.stage .tb .btn.primary{background:var(--acc-bg);color:var(--acc-fg)}
.btn.danger{background:#E01B24;color:#fff}
.btn.danger-flat{color:var(--err)}
.btn.dis{opacity:.45}
/* I16 : un bouton qui répète un hôte passe à la ligne au lieu de tronquer */
.stage[data-p] .btn.wrap{white-space:normal;text-align:center;max-width:300px;height:auto;line-height:1.25;padding-top:6px;padding-bottom:6px}
.split{display:inline-flex}
.split .btn:first-child{border-radius:6px 0 0 6px}
.split .btn:last-child{border-radius:0 6px 6px 0;margin-left:1px;padding:0 8px;min-width:0}
.stage[data-p=mac] .split .btn:last-child{width:22px;padding:0}
.focus{outline:2px solid var(--focus);outline-offset:1px}
.stage[data-p=mac] .focus{outline-width:3px;outline-offset:0}

/* listes, rangées, champs */
.page{flex:1;overflow:hidden;padding:24px 0;display:flex;flex-direction:column;align-items:center}
.clamp{width:100%;max-width:620px;display:flex;flex-direction:column;gap:24px;padding:0 12px}
.stage[data-p=mac] .clamp{gap:18px}
.grp-h{display:flex;align-items:flex-end;gap:12px;margin-bottom:10px}
.grp-h>div:first-child{flex:1}
.grp-h h5{font-size:1em;font-weight:700}
.grp-h p{color:var(--muted);font-size:.9em}
.grp-h .sfx{display:flex;gap:6px}
.list{background:var(--card);overflow:hidden}
.stage[data-p=adw] .list{border-radius:12px;box-shadow:0 0 0 1px var(--line2),0 1px 3px var(--shade)}
.stage[data-p=mac] .list{border-radius:8px;box-shadow:0 0 0 1px var(--line2)}
.row{display:flex;align-items:center;gap:12px;position:relative}
.stage[data-p=adw] .row{min-height:50px;padding:8px 12px}
.stage[data-p=adw] .row+.row{border-top:1px solid var(--line2)}
.stage[data-p=mac] .row{min-height:38px;padding:7px 10px}
.stage[data-p=mac] .row+.row::before{content:"";position:absolute;left:10px;right:10px;top:0;height:1px;background:var(--line2)}
.row .rt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row .rt small{color:var(--muted);font-size:.88em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .rt small.wrap{white-space:normal}
.row .sfx{display:flex;gap:8px;align-items:center;flex:none}
/* B2 : seul le titre d'une rangée inactive est grisé ; la raison reste en texte secondaire plein (≥ 4,5:1) */
.row.dim .rt>span{opacity:.55}
.row .rt small .ic{width:13px;height:13px;vertical-align:-2px;margin-right:4px}
/* M : boutons plats dans les rangées (libadwaita) ; AppKit garde ses boutons à contour */
.stage[data-p=adw] .row .sfx .btn:not(.primary){background:transparent}
.row .pre{flex:none;color:var(--muted);display:flex}
/* B2 : étiquette « Par défaut » neutre + coche (plus de blanc sur l'accent) */
.tag{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--btn);color:var(--fg);margin-left:6px;vertical-align:1px}
.tag .ic{width:11px;height:11px}
.stat{display:inline-flex;align-items:center;gap:6px}
.stat.ok svg{color:var(--ok)}.stat.err svg{color:var(--err)}.stat.warn svg{color:var(--warn)}
.sw{flex:none;position:relative;display:inline-block}
.sw::after{content:"";position:absolute;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.stage[data-p=adw] .sw{width:48px;height:26px;border-radius:13px;background:var(--btn-on)}
.stage[data-p=adw] .sw::after{top:3px;left:3px;width:20px;height:20px}
.stage[data-p=adw] .sw.on::after{left:25px}
.stage[data-p=mac] .sw{width:38px;height:22px;border-radius:11px;background:var(--seg)}
.stage[data-p=mac] .sw::after{top:1px;left:1px;width:20px;height:20px}
.stage[data-p=mac] .sw.on::after{left:17px}
.sw.on{background:var(--acc-bg)!important}
.entry{display:inline-flex;align-items:center;gap:8px;color:var(--fg);min-width:0}
.stage[data-p=adw] .entry{min-height:34px;padding:0 9px;border-radius:6px;background:var(--entry)}
.stage[data-p=mac] .entry{height:24px;padding:0 7px;border-radius:5px;background:var(--entry);box-shadow:0 0 0 .5px rgba(0,0,0,.28),inset 0 .5px 1px rgba(0,0,0,.08)}
.stage[data-p=mac][data-t=dark] .entry{box-shadow:0 0 0 .5px rgba(255,255,255,.2)}
.entry.err{box-shadow:0 0 0 2px var(--err)!important}
.entry .ph{color:var(--muted)}
.combo{display:inline-flex;align-items:center;gap:6px}
.stage[data-p=adw] .combo{color:var(--fg)}
.stage[data-p=adw] .combo .ic{width:12px;height:12px}
.stage[data-p=mac] .combo{height:22px;padding:0 6px 0 9px;border-radius:5px;background:var(--btn);box-shadow:0 0 0 .5px rgba(0,0,0,.2),0 .5px 1.5px rgba(0,0,0,.14)}
.stage[data-p=mac] .combo .ic{width:11px;height:11px;color:var(--acc-fg);background:var(--acc-bg);border-radius:3px;padding:1px}
.seg2{display:flex}
.seg2 .btn{flex:1;font-weight:500!important}
.stage[data-p=adw] .seg2 .btn{border-radius:0;margin-left:1px}
.stage[data-p=adw] .seg2 .btn:first-child{border-radius:6px 0 0 6px;margin-left:0}
.stage[data-p=adw] .seg2 .btn:last-child{border-radius:0 6px 6px 0}
.stage[data-p=adw] .seg2 .btn.on{background:var(--btn-on);font-weight:700!important}
.stage[data-p=mac] .seg2{background:var(--seg);border-radius:7px;padding:2px;gap:2px}
.stage[data-p=mac] .seg2 .btn{background:transparent;box-shadow:none;height:22px}
.stage[data-p=mac] .seg2 .btn.on{background:var(--btn-on);box-shadow:0 0 0 .5px rgba(0,0,0,.14),0 1px 2px rgba(0,0,0,.16)}
.notice{display:flex;gap:10px;text-align:left;padding:10px 12px;border-radius:10px;background:var(--btn);font-size:.94em;align-items:flex-start}
.notice>svg{flex:none;margin-top:2px}
.notice.warn{background:color-mix(in srgb,var(--warn) 14%,transparent)}.notice.warn>svg{color:var(--warn)}
.notice.err{background:color-mix(in srgb,var(--err) 12%,transparent)}.notice.err>svg{color:var(--err)}
.notice .body{display:flex;flex-direction:column;gap:8px;min-width:0}
.code{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:.9em;background:var(--entry);border-radius:6px;padding:6px 6px 6px 10px;box-shadow:inset 0 0 0 1px var(--line2)}
.code span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
kbd{font:600 12px/1 var(--font);min-width:22px;height:22px;padding:0 6px;display:inline-flex;align-items:center;justify-content:center;border-radius:4px;background:var(--k-raised);color:var(--k-text);box-shadow:inset 0 -1px 0 var(--k-line-strong)}
.win kbd,.dlg kbd,.gn kbd,.mn kbd{background:var(--btn);color:var(--fg);box-shadow:inset 0 -1px 0 var(--line)}
.kc{display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.kc i{font-style:normal;color:var(--muted);font-size:11px}
.hud .kc i{color:var(--k-muted)}
.vs{display:flex;gap:4px}
.vsb{border:0;background:transparent;color:var(--fg);display:inline-flex;align-items:center;gap:8px;border-radius:6px;font-weight:700}
.stage[data-p=adw] .vsb{height:34px;padding:0 16px}
.stage[data-p=adw] .vsb.on{background:var(--btn-h)}
.stage[data-p=mac] .vsb{flex-direction:column;gap:2px;padding:4px 12px;font-size:11px;font-weight:500;height:50px;justify-content:center}
.stage[data-p=mac] .vsb svg{width:20px;height:20px}
.stage[data-p=mac] .vsb.on{background:rgba(0,0,0,.07);color:var(--acc)}
.stage[data-p=mac][data-t=dark] .vsb.on{background:rgba(255,255,255,.1)}
.vsbar{flex:none;display:flex;justify-content:space-around;background:var(--hb);border-top:1px solid var(--line);padding:4px}
.vsbar .vsb{flex-direction:column;gap:2px;font-size:12px;height:52px;padding:0 10px;justify-content:center}
.status{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding:36px}
.status .big{width:96px;height:96px;color:var(--muted);opacity:.7}
.status h1{font-size:26.67px;font-weight:800}
.stage[data-p=mac] .status h1{font-size:20px;font-weight:700}
.status p{max-width:420px;color:var(--muted)}
.banner{flex:none;display:flex;align-items:center;gap:12px;padding:8px 10px 8px 14px}
.stage[data-p=adw] .banner{background:color-mix(in srgb,var(--acc-bg) 20%,var(--win))}
.stage[data-p=mac] .banner{background:var(--card);border-bottom:1px solid var(--line)}
.banner>span{flex:1}.banner>svg{color:var(--err)}.banner.ok>svg{color:var(--ok)}
.toast{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:5px 5px 5px 16px;border-radius:999px;background:rgba(30,30,32,.95);color:#fff;font-weight:700;box-shadow:0 2px 10px rgba(0,0,0,.35);white-space:nowrap;z-index:2}
.toast .url{font-weight:400;opacity:1}
.stage .toast .btn{background:rgba(255,255,255,.16);color:#fff;min-height:30px}
.prog{flex:none;height:4px;background:var(--line2)}.prog i{display:block;height:100%;background:var(--acc-bg)}

/* dialogues */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.32);z-index:4}
.dlg{position:absolute;z-index:6;background:var(--dlg);color:var(--fg);display:flex;flex-direction:column}
.stage[data-p=adw] .dlg{width:400px;border-radius:18px;padding:28px 24px 24px;text-align:center;gap:10px;box-shadow:0 0 0 1px rgba(0,0,6,.08),0 10px 40px rgba(0,0,6,.3)}
.stage[data-p=adw] .dlg h2{font-size:20px;font-weight:800}
.stage[data-p=adw] .dlg .acts{display:flex;gap:12px;margin-top:14px}
.stage[data-p=adw] .dlg .acts .btn{flex:1;min-height:40px;border-radius:10px}
.stage[data-p=mac] .dlg{width:300px;border-radius:12px;padding:20px 16px 16px;text-align:center;gap:8px;box-shadow:0 0 0 .5px rgba(0,0,0,.3),0 18px 50px rgba(0,0,0,.35)}
.stage[data-p=mac][data-t=dark] .dlg{box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),0 18px 50px rgba(0,0,0,.6)}
.stage[data-p=mac] .dlg h2{font-size:13px;font-weight:700}
.stage[data-p=mac] .dlg p{font-size:11.5px}
.stage[data-p=mac] .dlg .acts{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.stage[data-p=mac] .dlg .acts .btn{width:100%;height:28px}
.dlg .ico{align-self:center;width:56px;height:56px;display:grid;place-items:center;color:var(--muted)}
.dlg .ico svg{width:44px;height:44px}
.dlg .fld{display:flex;flex-direction:column;gap:6px;text-align:left;margin-top:6px}
.dlg .fld .entry{width:100%}
.dlg .msg{display:flex;align-items:flex-start;gap:8px;text-align:left;font-size:.92em}
.dlg .msg svg{flex:none;margin-top:2px}
.dlg .msg.err svg{color:var(--err)}.dlg .msg.ok svg{color:var(--ok)}
.dlg .foot{font-size:.86em;color:var(--muted);text-align:left}
.dlg .notice{font-size:.9em}
/* fenêtre « Raccourcis clavier » */
.stage[data-p] .dlg.wide{width:720px;text-align:left;padding:18px 24px 20px;gap:10px}
.stage[data-p] .dlg.wide h2{font-size:17px}
.dlg .kh{display:flex;align-items:center;justify-content:space-between}
.kgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:0 24px}
.kgrid h5{font-size:.92em;font-weight:700;margin:2px 0 4px}
.kr{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:27px;font-size:.9em;border-top:1px solid var(--line2)}
.kr>span:first-child{min-width:0}
.kr kbd{height:19px;min-width:19px;font-size:11px;padding:0 5px}
.sheetm{position:absolute;z-index:6;left:50%;top:62px;transform:translateX(-50%);width:620px;background:var(--win);border-radius:12px;padding:20px;box-shadow:0 0 0 .5px rgba(0,0,0,.3),0 18px 50px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:16px}
.sheetm .acts{display:flex;justify-content:flex-end;gap:10px}
.sheetm h3{font-size:13px;font-weight:700}

/* ---------- overlay (à nous) ---------- */
.ov{position:absolute;inset:0;overflow:hidden;cursor:crosshair}
.veil{position:absolute;inset:0;background:rgba(17,19,24,.55)}
/* B1 : classe propre à l'overlay (l'ancienne « .sel » touchait aussi la rangée active de la liste d'annotations) */
.ov-sel{position:absolute;border:1px solid #fff;box-shadow:0 0 0 1px rgba(17,19,24,.65),0 0 0 3000px rgba(17,19,24,.55)}
.hd{position:absolute;width:9px;height:9px;background:#fff;border:1px solid #111318;transform:translate(-50%,-50%)}
.hd.br{width:13px;height:13px;background:#FF8A1F}
.hit{position:absolute;width:24px;height:24px;transform:translate(-50%,-50%);outline:1px dashed #FF8A1F;outline-offset:-1px}
.hud{background:var(--k-surface);color:var(--k-text);border-radius:8px;box-shadow:var(--k-hud-sh);font-family:var(--font)}
.hud .muted{color:var(--k-muted)}
.badge{position:absolute;display:flex;align-items:center;gap:8px;padding:5px 10px;font-size:13px;border-radius:6px;font-variant-numeric:tabular-nums}
.badge b{font-weight:700}
.badge span{color:var(--k-muted)}
.loupe{position:absolute;padding:8px;display:flex;flex-direction:column;gap:6px}
.lgrid{position:relative;display:grid;grid-template-columns:repeat(15,8px);grid-template-rows:repeat(15,8px);box-shadow:0 0 0 1px var(--k-line-strong)}
.lgrid i{display:block;box-shadow:inset -1px -1px rgba(17,19,24,.07)}
.lgrid .lc{position:absolute;left:56px;top:56px;width:8px;height:8px;box-shadow:0 0 0 1px #111318,0 0 0 2px #fff,0 0 0 3px #111318}
.lgrid .le{position:absolute;background:#fff}
.lgrid .le.v{left:63px;top:0;width:1px;height:64px;box-shadow:1px 0 #111318}
.lgrid .le.h{left:0;top:63px;width:64px;height:1px;box-shadow:0 1px #111318}
.lread{font-size:12px;display:flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.lread .swatch{width:12px;height:12px;border-radius:2px;box-shadow:0 0 0 1px var(--k-line-strong)}
.ov-help{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);padding:10px 14px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;width:max-content;max-width:1080px}
.ov-help .r{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 18px;align-items:center}
.ov-help .it{display:inline-flex;gap:7px;align-items:center;white-space:nowrap}
.ov-help .lbl{color:var(--k-muted)}
.ov-help .r.main .lbl,.ov-help .r.main b{color:var(--k-text);font-weight:700}
.ov-q{position:absolute;left:16px;bottom:16px;padding:6px 10px;display:flex;gap:8px;align-items:center;font-size:13px}
.ov-msg{position:absolute;left:50%;top:62px;transform:translateX(-50%);padding:6px 12px;display:flex;gap:8px;align-items:center;font-size:13px;white-space:nowrap}
.ov-chip{position:absolute;left:50%;top:16px;transform:translateX(-50%);padding:6px 12px;font-size:13px;border-radius:999px;display:flex;gap:8px;align-items:center;white-space:nowrap}
.xh{position:absolute;background:rgba(255,255,255,.8)}
.xh.h{left:0;right:0;height:1px;box-shadow:0 1px rgba(17,19,24,.55)}
.xh.v{top:0;bottom:0;width:1px;box-shadow:1px 0 rgba(17,19,24,.55)}
.mon{position:absolute;overflow:hidden;border-radius:4px;box-shadow:0 0 0 3px #0B0C10,0 10px 30px rgba(0,0,0,.5)}
.mon-in{position:absolute;left:0;top:0;width:1200px;height:760px;transform-origin:0 0}
.monlbl{position:absolute;font:600 12.5px Inter,sans-serif;color:#ECEEF2}
.term{position:absolute;inset:0;background:#16181D;color:#C9D1D9;font:22px/1.5 "JetBrains Mono",monospace;padding:30px;white-space:pre}
.term .g{color:#56D364}.term .y{color:#E3B341}

/* ---------- capture simulée (contenu d'un tiers) ---------- */
.shot{position:absolute;left:0;top:0;width:1200px;height:760px;background:#fff;color:#1F2328;font:14px/1.4 Inter,Arial,sans-serif;overflow:hidden;text-align:left}
.sh-tabs{height:38px;background:#DEE1E6;display:flex;align-items:flex-end;gap:4px;padding:0 12px}
.sh-tab{width:230px;padding:8px 14px;font-size:12px;border-radius:8px 8px 0 0;background:#CDD1D7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-tab.on{background:#F6F8FA}
.sh-url{height:40px;background:#F6F8FA;border-bottom:1px solid #D0D7DE;display:flex;align-items:center;padding:0 16px}
.sh-url span{width:540px;padding:5px 14px;font-size:12.5px;color:#57606A;background:#fff;border:1px solid #D0D7DE;border-radius:16px}
.sh-nav{position:absolute;left:0;top:78px;bottom:0;width:200px;background:#F6F8FA;border-right:1px solid #D0D7DE;padding:20px 16px;display:flex;flex-direction:column;gap:14px}
.sh-nav b{font-size:15px}.sh-nav i{display:block;height:9px;border-radius:5px;background:#D0D7DE}.sh-nav i.on{background:#3A5F9E}
.sh-h{position:absolute;left:232px;top:98px;font-size:24px;font-weight:600;white-space:nowrap}.sh-h span{color:#59636E;font-weight:400}
.sh-meta{position:absolute;left:232px;top:140px;display:flex;align-items:center;gap:8px;color:#59636E}
.sh-meta code{font:12px "JetBrains Mono",monospace;background:#DDF4FF;color:#0550AE;padding:1px 6px;border-radius:6px}
.sh-av{display:inline-block;width:20px;height:20px;border-radius:50%;background:#B392F0;flex:none}.sh-av.b{background:#56D364}.sh-av.c{background:#F0883E}
.sh-t2{position:absolute;left:232px;top:176px;width:620px;height:33px;border-bottom:1px solid #D0D7DE;display:flex;gap:22px;color:#59636E}
.sh-t2 b{color:#1F2328;border-bottom:2px solid #FD8C73;font-weight:600}
.sh-card{position:absolute;left:232px;top:232px;width:620px;height:178px;border:1px solid #D0D7DE;border-radius:6px;background:#fff;overflow:hidden}
.sh-ch{height:40px;background:#F6F8FA;border-bottom:1px solid #D0D7DE;display:flex;align-items:center;gap:8px;padding:0 16px;color:#59636E}.sh-ch b{color:#1F2328}
.sh-l{position:absolute;left:16px;font:13px/18px "JetBrains Mono",ui-monospace,monospace;white-space:pre;color:#1F2328}.sh-l.e{color:#CF222E}
.sh-p{position:absolute;left:16px;top:144px;font-size:14px;line-height:20px;white-space:nowrap}
.sh-card2{position:absolute;left:232px;top:470px;width:620px;height:76px;border:1px solid #D0D7DE;background:#F6F8FA;display:flex;align-items:center;gap:8px;padding:0 16px}
.sh-merge{position:absolute;left:503px;top:18px;width:100px;height:38px;border-radius:6px;background:#3A5F9E;color:#fff;font-weight:600;display:flex;align-items:center;justify-content:center}
.sh-side{position:absolute;left:884px;top:100px;width:280px;font-size:13px;color:#59636E}
.sh-side h6{font-size:12px;color:#1F2328;margin:16px 0 8px;font-weight:600}
.sh-side p{display:flex;gap:6px;align-items:center;padding-bottom:10px;border-bottom:1px solid #D0D7DE}
.sh-chip{padding:1px 8px;border-radius:10px;background:#FFEBE9;color:#A40E26;font-size:12px}.sh-chip.b{background:#DDF4FF;color:#0550AE}
.cropbox{position:relative;overflow:hidden;flex:none}
.cropbox>.sc{position:absolute;left:0;top:0;width:1200px;height:760px;transform-origin:0 0}

/* ---------- éditeur ---------- */
.tools{flex:none;display:flex;align-items:center;gap:4px;padding:6px 8px;background:var(--hb);border-bottom:1px solid var(--line)}
.stage[data-p=mac] .tools{background:var(--win)}
.tools.dis .tool{opacity:.45}
.tool{width:44px;height:52px;flex:none;border:0;border-radius:8px;background:transparent;color:var(--fg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.tool svg{width:20px;height:20px}
.tool span{font-size:11px;font-weight:700;line-height:1;color:var(--muted);letter-spacing:.02em}
.tool.on{background:var(--k-accent);color:var(--k-on-accent)}.tool.on span{color:var(--k-on-accent)}
.stage[data-t=light] .tool.on{box-shadow:inset 0 0 0 1px var(--k-accent-text)}
.tool.hov{background:var(--btn)}
/* I13 : focus visible des outils, y compris sur l'outil actif */
.tool.focus-t{outline:2px solid var(--k-text);outline-offset:2px}
/* outil proposé, en attente de décision (Recadrer) */
.tool.prop{outline:1px dashed var(--muted);outline-offset:-3px}
.tsep{width:1px;height:30px;background:var(--line);margin:0 4px;flex:none}
.tools .end{margin-left:auto;display:flex;gap:6px;align-items:center}
.tools.compact{gap:2px}.tools.compact .tsep{margin:0 2px}
.ed{flex:1;display:flex;min-height:0}
.cv{flex:1;position:relative;background:var(--side);display:flex;align-items:center;justify-content:center;overflow:hidden}
.crop{box-shadow:0 0 0 1px rgba(0,0,0,.14),0 4px 16px rgba(0,0,0,.2)}
.crop svg.ann{position:absolute;left:0;top:0}
.a-mask{position:absolute;background:#15171C}
/* M : flou de la maquette proche du rendu « Fort » (24 px × échelle) */
.a-blur{position:absolute;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);background:rgba(255,255,255,.08)}
.a-selbox{position:absolute;outline:1px dashed #111318;box-shadow:0 0 0 1px #fff}
.a-selbox i{position:absolute;width:8px;height:8px;background:#fff;border:1px solid #111318;transform:translate(-50%,-50%)}
.a-text{position:absolute;background:#E01B24;color:#fff;font-family:Inter,system-ui,"DejaVu Sans",sans-serif;font-weight:700;line-height:1.2;padding:.18em .45em;white-space:nowrap;outline:1px dashed #111318;outline-offset:3px}
.a-text .caret{display:inline-block;width:2px;height:1em;background:#fff;margin-left:2px;vertical-align:-.12em}
.side{width:288px;flex:none;background:var(--win);border-left:1px solid var(--line);padding:14px 16px;display:flex;flex-direction:column;gap:14px;overflow:hidden}
.side h4{font-size:1.05em;font-weight:700;display:flex;align-items:center;gap:8px}
.side .lbl{font-weight:700;font-size:.86em;margin-bottom:6px;display:block}
.sws{display:flex;flex-wrap:wrap;gap:0}
.swb{width:36px;height:36px;border:0;background:transparent;display:grid;place-items:center;border-radius:50%;padding:0}
/* I14 : contour k-line-strong (≥ 3:1) autour de chaque pastille, y compris le blanc et le noir */
.swb i{width:26px;height:26px;border-radius:50%;background:var(--c);box-shadow:0 0 0 1px var(--k-line-strong);display:grid;place-items:center;color:var(--ck)}
.swb.on i{box-shadow:0 0 0 1px var(--k-line-strong),0 0 0 3px var(--win),0 0 0 5px var(--fg)}
.swb svg{width:14px;height:14px}
.alist .row{min-height:36px!important;padding:4px 10px!important;gap:10px}
.alist .row .rt>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* B1 : la rangée active est désignée par aria-selected, jamais par la classe de l'overlay */
.stage[data-p=adw] .alist .row[aria-selected=true]{background:var(--btn-h)}
.stage[data-p=mac] .alist .row[aria-selected=true]{background:var(--acc-bg);color:var(--acc-fg)}
.stage[data-p=mac] .alist .row[aria-selected=true] .muted{color:#fff}
.alist svg{width:16px;height:16px;flex:none}

/* ---------- barres système, notifications, miniature ---------- */
.gtop{position:absolute;left:0;right:0;top:0;height:30px;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13.5px;z-index:3}
.gtop .l{position:absolute;left:10px;display:flex;gap:5px;align-items:center}
.gtop .l i{width:28px;height:8px;border-radius:4px;background:#fff}.gtop .l i.o{width:8px;background:#777}
.gtop .r{position:absolute;right:12px;display:flex;gap:10px;align-items:center}
.mbar{position:absolute;left:0;right:0;top:0;height:26px;display:flex;align-items:center;gap:18px;padding:0 14px;font-size:13px;z-index:3;background:rgba(255,255,255,.5);color:#111;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.stage[data-t=dark] .mbar{background:rgba(20,20,22,.45);color:#fff}
.mbar b{font-weight:700}.mbar .r{margin-left:auto;display:flex;gap:14px;align-items:center}
.mbar .si{display:inline-flex;padding:3px 6px;border-radius:4px}
.mbar .si.on,.mbar>span.on{background:rgba(0,0,0,.14)}
.stage[data-t=dark] .mbar .si.on,.stage[data-t=dark] .mbar>span.on{background:rgba(255,255,255,.22)}
.mbar>span.on{border-radius:4px;padding:1px 7px;margin:0 -7px}
/* menus (résident, barre de menus) */
.menu{position:absolute;z-index:6;min-width:290px;display:flex;flex-direction:column;font-size:13px;color:var(--fg);font-family:var(--font)}
.stage[data-p=mac] .menu{padding:5px;border-radius:8px;background:color-mix(in srgb,var(--dlg) 94%,transparent);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);box-shadow:0 0 0 .5px rgba(0,0,0,.25),0 10px 30px rgba(0,0,0,.25)}
.stage[data-p=mac][data-t=dark] .menu{box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),0 0 0 .5px #000,0 10px 30px rgba(0,0,0,.5)}
.mi{display:flex;align-items:center;gap:8px;min-height:22px;padding:0 10px;border-radius:4px;white-space:nowrap}
.mi .k{margin-left:auto;padding-left:28px;color:var(--muted);font-variant-numeric:tabular-nums}
.stage[data-p=mac] .mi.on{background:var(--acc-bg);color:var(--acc-fg)}
.stage[data-p=mac] .mi.on .k{color:var(--acc-fg)}
.mh{padding:5px 10px 2px;font-size:11px;font-weight:700;color:var(--muted)}
.msep{height:1px;background:var(--line);margin:5px 10px;flex:none}
.stage[data-p=adw] .menu{padding:5px;border-radius:10px;background:var(--dlg);box-shadow:0 0 0 1px var(--line),0 8px 24px rgba(0,0,0,.3)}
.stage[data-p=adw] .mi{min-height:32px;padding:0 12px;border-radius:6px}
.stage[data-p=adw] .mi .ic{color:var(--muted)}
.stage[data-p=adw] .mi.on{background:var(--btn-h)}
.stage[data-p=adw] .mi.on .k{color:var(--fg)}
.menu.kde .mi.on{background:color-mix(in srgb,#3DAEE9 22%,transparent);box-shadow:inset 0 0 0 1px #3DAEE9}
.kpanel .ktray{display:inline-flex;padding:6px;border-radius:6px}
.kpanel .ktray.on{background:rgba(255,255,255,.18);box-shadow:inset 0 -2px 0 #3DAEE9}
.gdash{position:absolute;display:flex;gap:10px;padding:10px;border-radius:22px;background:rgba(255,255,255,.2);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.gdash>span{position:relative;width:52px;height:52px;border-radius:12px;display:grid;place-items:center}
.gdash>span.o{background:rgba(255,255,255,.22)}
.gdash>span.on{background:rgba(255,255,255,.28)}
.gdash>span.on::after{content:"";position:absolute;bottom:-6px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:#fff}
.lthumb{display:block;width:64px;height:36px;border-radius:4px;flex:none;box-shadow:0 0 0 1px var(--line)}
.kpanel{position:absolute;left:0;right:0;bottom:0;height:44px;background:rgba(32,35,40,.94);display:flex;align-items:center;gap:8px;padding:0 10px;color:#fff;font-size:12px;z-index:3}
.kpanel i{width:28px;height:28px;border-radius:6px;background:rgba(255,255,255,.14)}
.kpanel .r{margin-left:auto;display:flex;gap:10px;align-items:center}
.gn{position:absolute;width:420px;border-radius:14px;background:var(--dlg);color:var(--fg);box-shadow:0 0 0 1px var(--line2),0 6px 22px rgba(0,0,0,.28);padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px}
.gn .h{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.gn .b{display:flex;gap:12px;align-items:flex-start}
.gn .b>div{min-width:0;display:flex;flex-direction:column;gap:2px}
.gn .acts{display:flex;gap:6px;margin-top:4px}
.gn .acts .btn{flex:1;border-radius:999px}
.mn{position:absolute;width:344px;border-radius:16px;background:rgba(246,246,246,.9);color:#1D1D1F;box-shadow:0 0 0 .5px rgba(0,0,0,.18),0 10px 30px rgba(0,0,0,.22);padding:12px 14px;display:flex;gap:10px;-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);font-size:13px}
.stage[data-t=dark] .mn{background:rgba(44,44,46,.9);color:#EEE;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),0 10px 30px rgba(0,0,0,.5)}
.mn .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.mn .tx .t{display:flex;justify-content:space-between;gap:8px}

function notifCard(n,x,y){

  /* M : le système dessine les notifications, sans bouton d'accent ; l'action utile est simplement la première */
  const acts=n.acts.map(a=>btn(a)).join('');
  if(mac())return `<div class="mn" style="left:${x+38}px;top:${y}px" role="alert">${appIcon(34)}<div class="tx"><div class="t"><b>${n.title}</b><time>${T('maintenant','now')}</time></div><div>${n.body}</div><div class="acts">${acts}</div></div></div>`;
  return `<div class="gn" style="left:${x}px;top:${y}px" role="alert"><div class="h">${appIcon(16)}<span>Kropa</span><span>·</span><span>${T('maintenant','now')}</span></div><div class="b"><div><b>${n.title}</b><span>${n.body}</span></div></div><div class="acts">${acts}</div></div>`;}
function scrNotif(){const url='<span class="url">https://img.maison.lan/u/a3F9k.png</span>';
  const N=[
   {cap:T('Lien copié · KDE et macOS ; GNOME après le clic sur « Copier le lien »','Link copied · KDE and macOS; GNOME after clicking “Copy link”'),title:T('Lien copié','Link copied'),body:`${url}<br>${T('Enregistrée dans ~/Images/Kropa.','Saved to ~/Pictures/Kropa.')}`,acts:[T('Ouvrir','Open'),T('Annoter','Annotate')]},
   {cap:T('Lien prêt · GNOME, seulement si aucune fenêtre Kropa n’a le focus','Link ready · GNOME, only when no Kropa window has focus'),gnomeOnly:true,primary:true,title:T('Lien prêt','Link ready'),body:`${url}<br>${T('GNOME ne permet pas de copier sans votre clic.','GNOME does not allow copying without your click.')}`,acts:[T('Copier le lien','Copy link'),T('Ouvrir','Open')]},
   {cap:T('Envoi échoué · le serveur a répondu','Upload failed · the server answered'),primary:true,title:T('Envoi échoué','Upload failed'),body:T('Zipline a répondu 503 (service indisponible). La capture est enregistrée en local et reste dans la file d’attente.','Zipline answered 503 (service unavailable). The capture is saved locally and stays in the queue.'),acts:[T('Réessayer','Retry'),T('Voir le journal','View log')]},
   {cap:T('Envoi en attente · réseau','Upload pending · network'),title:T('Envoi en attente','Upload pending'),body:T('img.maison.lan ne répond pas. Nouvel essai dans 30 s.','img.maison.lan is not responding. Retrying in 30 s.'),acts:[T('Réessayer maintenant','Retry now')]},
   {cap:T('Coffre verrouillé · la tâche attend, elle n’échoue pas','Vault locked · the job waits, it does not fail'),primary:true,title:T('Envoi en attente : coffre verrouillé','Upload waiting: vault locked'),body:T('2 captures attendent le jeton de img.maison.lan.','2 captures are waiting for the img.maison.lan token.'),acts:[T('Déverrouiller…','Unlock…')]}];
  const pos=[[150,62],[630,62],[150,262],[630,262],[150,452]];
  let h=desk(mac()?'mac':'gnome');
  N.forEach((n,i)=>{const [x,y]=pos[i];h+=`<p class="cap" style="left:${x}px;top:${y}px">${n.cap}</p>`+notifCard(n,x,y+26);});
  h+=`<p class="cap" style="left:630px;top:470px;max-width:420px">${mac()?T('macOS : bannière UNUserNotificationCenter ; les actions apparaissent au survol (« Options ») sauf en style « Alerte ». Elles sont dessinées ici pour la lecture.','macOS: UNUserNotificationCenter banner; actions appear on hover (“Options”) unless the style is “Alert”. They are drawn here for reading.'):T('Linux : portail Notification. GNOME Shell dessine la bannière ; KDE Plasma dessine la sienne avec le même contenu. Jamais « Lien copié » avant la copie réelle.','Linux: Notification portal. GNOME Shell draws the banner; KDE Plasma draws its own with the same content. Never “Link copied” before the real copy.')}</p>`;
  return h;}

function scrSettings(){const st=S.state;

  const cur=(st.startsWith('dest')||st.startsWith('test')||st.startsWith('import'))?'dest':(st.startsWith('shortcuts')?'shortcuts':'general');

  if(st==='test'){const d=`<div class="dlg" role="alertdialog" aria-modal="true" style="left:${mac()?300:250}px;top:${mac()?62:200}px">${mac()?`<div class="ico">${appIcon(56)}</div>`:''}<h2>${T('Tester « Zipline maison » ?','Test “Zipline maison”?')}</h2><p>${T('Kropa va envoyer une image témoin de 1 × 1 pixel à <b class="mono">img.maison.lan</b>. Elle restera sur votre serveur si vous ne la supprimez pas.','Kropa will send a 1 × 1 pixel test image to <b class="mono">img.maison.lan</b>. It stays on your server unless you delete it.')}</p><div class="acts">${mac()?btn(T('Envoyer l’image témoin','Send the test image'),'primary')+btn(T('Annuler','Cancel')):btn(T('Annuler','Cancel'))+btn(T('Envoyer l’image témoin','Send the test image'),'primary')}</div></div>`;

function scrVault(){const st=S.state,busy=st==='busy',err=st==='error'||st==='delay',delay=st==='delay';
  const path=mac()?'~/Library/Application Support/io.github.<compte>.Kropa/secrets.age':'~/.local/share/kropa/secrets.age';
  const why=mac()?T('Vous avez choisi le coffre plutôt que le trousseau macOS.','You chose the vault instead of the macOS Keychain.'):T('Aucun trousseau système n’est disponible sur cette session.','No system keyring is available in this session.');
  const msg=busy?`<div class="msg"><span class="spin"></span><span>${T('Déchiffrement… environ 1 seconde.','Decrypting… about 1 second.')}</span></div>`
    :err?`<div class="msg err" role="alert">${ic('err')}<span>${T('Phrase de passe incorrecte ou fichier altéré.','Wrong passphrase or damaged file.')}${delay?'<br>'+T('3 essais incorrects : nouvel essai possible dans 8 s.','3 wrong attempts: you can try again in 8 s.'):''}</span></div>`:'';
  const primary=busy?`<span class="spin"></span>${T('Déverrouillage…','Unlocking…')}`:delay?T('Réessayer dans 8 s','Retry in 8 s'):T('Déverrouiller','Unlock');
  const pb=btn(primary,'primary'+((busy||delay)?' dis':'')),cb=btn(T('Annuler','Cancel'));
  /* M : pas d'œil sous AppKit (NSSecureTextField n'en a pas) ; sous GNOME, GtkPasswordEntry avec nom accessible */

function scrIcons(){
  return `<div class="icons">${TOOLS().filter(t=>t!=='|').map(([k,n,l,file,prop])=>`<div class="icard${prop?' sys':''}"><h6><span>${l}${prop?' · '+T('proposé','proposed'):''}</span><span>${k}</span></h6><div class="rowi"><div class="g80">${ti(n,80)}</div><div style="display:flex;flex-direction:column;gap:8px"><div style="display:flex;gap:8px;align-items:center"><span class="lt">${ti(n,20)}</span><span class="lt s16">${ti(n,16)}</span></div><div style="display:flex;gap:8px"><span class="act">${ti(n,20)}<span>${k}</span></span><span class="drk">${ti(n,20)}</span></div></div></div><code>${file?file+'-symbolic.svg':T('icône système (substitut dessiné ici)','system icon (stand-in drawn here)')}</code></div>`).join('')}
<div class="icard" style="justify-content:center"><h6>${T('Construction','Construction')}</h6><p style="font-size:12px;color:var(--k-muted)">${T('Grille 20 px (1 case = 1 px), marge 2 px en pointillés. Contours pleins qui reproduisent un trait de 1,75 px, angles vifs, extrémités carrées. Une couleur, recolorée par GTK ; gabarit (Template) sous macOS. 16 px montré à titre de contrôle : à éviter.','20 px grid (1 cell = 1 px), 2 px margin dashed. Filled outlines reproducing a 1.75 px stroke, sharp corners, square caps. One colour, recoloured by GTK; Template image on macOS. 16 px shown as a check: avoid.')}</p></div></div>`;}

/* =================== NOTES (habillage) =================== */
const NOTES={
overlay:`<h2>(a) Overlay de sélection</h2><ul>
<li>Surface entièrement à Kropa, identique sur les deux plateformes ; seules les étiquettes de touches changent (Maj / ⇧, Alt / ⌥, Ctrl / ⌘). Règle unique, comme dans l’éditeur : flèches = 1 px, <b>Maj = ×10</b>, Alt / ⌥ = redimensionner depuis la poignée ambre. Pas de pas de 100 px.</li>
<li><b>Ctrl+A / ⌘A</b> sélectionne l’écran actif entier, ajustable ensuite. <b>Entrée sans zone ne fait rien</b> : l’aide rappelle « Glissez ou Ctrl+A ». La première ligne de l’aide porte les actions principales, en gras.</li>
<li>Priorité des HUD : la zone n’est jamais couverte. Dimensions sous la zone, sinon au-dessus ; loupe du côté opposé au bord le plus proche ; aide en bas au centre, repliée sur « ? » si elle couvrirait la zone (état « Bord et petite zone »).</li>
<li>Zones de prise de 24 px minimum autour des poignées de 9 px ; sous 48 px de côté, les poignées médianes disparaissent et les coins débordent vers l’extérieur. Au bord de l’écran, les poignées restent visibles, à l’intérieur.</li>
<li>Image figée : la pastille du haut le dit (heure, écran, échelle). Voile <code>rgba(17,19,24,.55)</code> constant, zone à 100 %. Bord blanc 1 px doublé d’un liseré sombre : au moins 4,3:1 contre n’importe quel fond.</li>
<li>Poignée ambre au coin bas droit = poignée du logo = coin que déplace Maj+flèches. Les autres poignées sont blanches, angles vifs.</li>
<li>Dimensions et position en <b>pixels physiques</b> (taille du PNG produit) ; la loupe montre 15 × 15 pixels physiques × 8, pixel central cerclé, bord de sélection tracé, hex et coordonnées. Elle change de côté près d’un bord.</li>
<li>Avant sélection : réticule pleine largeur, loupe ; l’aide propose de glisser ou Ctrl+A.</li>
<li>Multi-écran : un overlay par écran ; sélection limitée à un écran (échelles mixtes) ; Tab passe à l’écran suivant et l’annonce ; Tab n’apparaît pas avec un seul écran ; au bord, « La zone ne peut pas dépasser cet écran ».</li>
<li>Accessibilité : annonce polie « Zone 1280 par 720 pixels, position 424, 372 » après 500 ms sans mouvement. Aucune animation d’apparition.</li>
<li>Thème : seuls l’aide, la pastille, les dimensions et la loupe suivent clair/sombre ; le voile et la sélection ne changent pas.</li></ul>`,
editor:`<h2>(b) Éditeur</h2><ul>
<li>Fenêtre native : AdwToolbarView + AdwHeaderBar ; NSWindow à barre d’outils unifiée. Panneau de style : AdwOverlaySplitView (fin) / inspecteur NSSplitViewController.</li>
<li>Barre d’outils à une touche, lettre visible sous chaque icône, cibles de 44 × 52 px. Groupes : sélection (V), formes (A R O L), tracé (T P H), compteur (N), masquage (B X M), puis <b>Recadrer (C), proposé</b> : icône système, en attente de décision (contour pointillé dans la maquette seulement).</li>
<li>Sélection d’objet : un clic sans glisser sur un objet le sélectionne, quel que soit l’outil ; glisser dessine. L’outil V sélectionne et déplace. Échap annule le tracé en cours, termine la saisie, puis désélectionne ; <b>il ne ferme jamais la fenêtre</b> (Ctrl+W / ⌘W). F6 fait le tour barre → canevas → panneau → barre d’en-tête.</li>
<li>Outil actif : remplissage ambre, icône et lettre <code>#111318</code> (7,88:1) ; liseré <code>k-accent-text</code> en clair. Focus clavier : anneau 2 px <code>k-text</code> décalé de 2 px, visible aussi sur l’outil actif (état par défaut).</li>
<li>Liste des annotations : ordre de Tab ; nom accessible complet (type, couleur, taille, position en pixels physiques) ; un seul numéro visible, celui du compteur. Pastilles de couleur cerclées de <code>k-line-strong</code>, coche et nom.</li>
<li>Flou : avertissement et raccourci vers le masque. Envoi : barre de progression, bouton occupé, outils désactivés. <b>Succès : l’éditeur reste ouvert</b> ; sous GNOME, la fenêtre a le focus, donc copie directe et AdwToast « Lien copié » ; sous macOS, barre d’information. Erreur : bandeau (AdwBanner) / barre d’information ; rien n’est perdu.</li>
<li>Bouton principal système : accent de l’utilisateur sous GNOME ; AccentColor ambre profond sous macOS (appliqué en mode « Multicolore »).</li></ul>`,
notif:`<h2>(c) Notifications</h2><ul>
<li>Textes du ton de la marque : ce qui s’est passé, où est le fichier, quoi faire. Pas de point d’exclamation.</li>
<li>GNOME : « Lien prêt » + « Copier le lien » (le clic donne un jeton d’activation, donc le focus, donc la copie). Après la copie réelle seulement : « Lien copié ». Statut CLI <code>pending</code> puis <code>copied</code>.</li>
<li>« Envoi échoué » : bouton Réessayer pour une erreur passagère (5xx, réseau). Pour un 401, la première action devient « Remplacer le jeton… » (réessayer échouerait) ; un 403 dit « a refusé l’envoi (403) » avec « Voir le journal ». Boutons sans accent : c’est le système qui dessine.</li>
<li>« Lien prêt » n’apparaît sous GNOME que si aucune fenêtre Kropa n’a le focus ; depuis l’éditeur, la copie est directe.</li>
<li>Coffre verrouillé : la tâche passe <code>waiting_unlock</code>, la notification propose Déverrouiller.</li></ul>`,
settings:`<h2>(d) Réglages</h2><ul>
<li>GNOME : AdwApplicationWindow + AdwViewSwitcher dans la barre d’en-tête (pas d’AdwPreferencesDialog : le résident n’a pas de fenêtre parente) ; sous 400 px, AdwBreakpoint passe la navigation en bas (état « Fenêtre étroite »). macOS : fenêtre Réglages à onglets de barre d’outils, ⌘,.</li>
<li>Destinations : défaut marqué par texte, état « Secret manquant » icône + texte. Test : confirmation explicite qui nomme l’hôte, puis résultat (statut, URL, lien formaté, suppression si l’API le permet).</li>
<li>Import .sxcu : hôte en entier, jamais tronqué, et sa <b>forme ASCII (punycode)</b> quand elle diffère ; HTTPS affiché ; secrets masqués (4 derniers caractères seulement si le secret en compte au moins 16) avec leur magasin ; champs ignorés listés ; le bouton répète l’hôte et passe à la ligne. Un <code>http://</code> avec secret est refusé avant cet écran (état « Import http refusé »).</li>
<li>Test : succès, échec (401 : « Remplacer le jeton… », « Voir le journal »). Boutons des rangées plats sous libadwaita. Étiquette « Par défaut » neutre avec coche.</li>
<li>Raccourcis : GNOME délègue au portail (Kropa propose, GNOME confirme) ; wlroots dit franchement « indisponible » et donne la ligne <code>bindsym</code> ; macOS refuse ⌥ / ⌥⇧ seuls au moment de la saisie et garde l’ancien raccourci.</li></ul>`,
vault:`<h2>(e) Déverrouillage du coffre age</h2><ul>
<li>Dialogue court (déclenché par la file ou une notification) : AdwAlertDialog + GtkPasswordEntry (œil avec nom accessible) ; NSAlert + NSSecureTextField (pas d’œil). Sans fenêtre parente, le dialogue s’ouvre dans sa propre fenêtre (à vérifier sur la version de libadwaita ciblée) ; les réglages, tâche durable, restent une fenêtre.</li>
<li>Création : deux saisies, correspondance annoncée, avertissement de perte, emplacement du fichier.</li>
<li>États : saisie (focus dans le champ), déchiffrement (≈ 1 s, scrypt : bouton occupé), erreur unique « incorrecte ou fichier altéré » (age ne distingue pas), délai croissant après 3 essais.</li>
<li>Dit pourquoi le coffre sert (pas de trousseau / choix de l’utilisateur), où est le fichier, combien de temps il reste ouvert, et la commande équivalente.</li></ul>`,
queue:`<h2>(f) File d’attente</h2><ul>
<li>Chaque tâche : nom (ellipse au milieu, nom complet en infobulle et description accessible), destination, taille, statut icône + texte, une action utile.</li>
<li>Statuts <code>running</code>, <code>waiting_unlock</code>, <code>waiting_network</code>, <code>failed</code> (401 : remplacer le jeton), <code>done</code>. État vide avec la commande CLI.</li></ul>`,
firstrun:`<h2>(g) Premier lancement et permissions</h2><ul>
<li>Quatre étapes : bienvenue (langue, dossier), permission de capture, raccourci, prêt. Aucune destination exigée, aucune requête réseau.</li>
<li>Une permission à la fois, expliquée <b>avant</b> le dialogue du système, qui est montré pour référence (état « En attente »). Refus : sous GNOME, commande qui efface le refus du magasin d’autorisations (<code>flatpak permission-reset</code>, ou commande donnée par <code>kropa doctor</code> hors Flatpak), puis Réessayer ; sous macOS, chemin des Réglages Système et remède « retirer puis rajouter ».</li>
<li>Sway et wlroots : aucune autorisation (screencopy) ; l’écran liste les capacités détectées, y compris l’absence du portail.</li>
<li>macOS : rappel mensuel et effet possible des mises à jour dits franchement.</li></ul>`,
thumb:`<h2>(h) Miniature flottante et variante GNOME</h2><ul>
<li>macOS : NSPanel non activant ; KDE et wlroots : surface layer-shell ancrée. Même carte : aperçu, Annoter, Copier, Envoyer, décompte de 5 s en <code>k-accent-text</code>, en pause au survol ou au focus. Actions de 48 px, fermeture 28 px visibles pour 44 px de zone.</li>
<li>Raccourcis affichés seulement quand le panneau a le focus clavier. Annonce à l’apparition ; jamais de fermeture automatique avec VoiceOver ; réglage « Miniature » : 5 s, 10 s ou Jusqu’à fermeture.</li>
<li>GNOME : notification avec les mêmes actions ; petit aperçu à vérifier en prototype.</li>
<li>Mouvement : entrée 200 ms par glissement de 16 px ; mouvement réduit = apparition sans glissement. La durée ne dépend pas du mouvement réduit.</li></ul>`,
resident:`<h2>(i) Menu résident et lanceur</h2><ul>
<li>macOS : NSStatusItem (symbole Kropa en gabarit) et NSMenu ; LSUIElement. Une fenêtre ouverte fait apparaître le Dock et la barre de menus (menu Outils avec les lettres).</li>
<li>KDE : StatusNotifierItem (ksni) ; clic gauche = capturer une zone, clic droit = même menu.</li>
<li>GNOME : pas d’icône sans extension. Lanceur (fenêtre ouverte depuis la grille d’applications), actions du .desktop, notifications, raccourci global. La fenêtre se masque avant la capture.</li>
<li>Contenu commun : capturer (zone, écran, dernière zone), dernière capture (ouvrir, copier l’image, copier le lien), file d’attente, coffre si un envoi l’attend, réglages, quitter. L’état est dit en texte, jamais par un badge seul.</li></ul>`,
icons:`<h2>Icônes d’outils (D2.2)</h2><ul>
<li>Fichiers : <code>docs/design/icons/kropa-tool-*-symbolic.svg</code>, contours pleins <code>#2e3436</code> (recolorés par GTK). Sous macOS, exporter en PDF gabarit (<code>…Template</code>).</li>
<li>Affichées à 20 px (<code>-gtk-icon-size: 20px</code> / taille de point 20) ; 16 px montré pour contrôle seulement : le trait tombe à 1,4 px.</li>
<li>Sélection (V) : pointeur plein, comme les pointeurs système. Recadrer (C, proposé) : icône système, pas de fichier Kropa (carte en pointillés). Les <code>&lt;title&gt;</code> des SVG sont neutres (nom de fichier) : le nom lisible vient du bouton.</li></ul>`};

function states(){let L=STATES[S.screen];
  if(S.screen==='settings'){L=L.filter(([k])=>!(k==='narrow'&&mac())).map(([k,l])=>k==='shortcuts-alt'?[k,mac()?'Raccourci refusé (⌥)':'Raccourcis sous wlroots']:[k,l]);}

  if(S.screen==='resident')L=L.filter(([k])=>mac()?(k==='menu'||k==='menubar'):(k==='kde'||k==='gnome'));
  return L;}
function stage(){return `<div class="stage" data-p="${S.p}" data-t="${S.t}" lang="${S.lang}">${SCR[S.screen]()}</div>`}
function controls(){const seg=(k,o)=>`<div class="seg" role="group">${o.map(([v,l])=>`<button type="button" data-k="${k}" data-v="${v}" aria-pressed="${S[k]===v}">${l}</button>`).join('')}</div>`;
  document.getElementById('ctl').innerHTML=`<h1>kropa <small>maquettes D2.3 révisées · contrôles système imités en CSS, la référence reste le widget natif</small></h1>
<div class="ctl">${seg('screen',SCREENS)}</div>
<div class="ctl"><span>Plateforme</span>${seg('p',[['adw','libadwaita'],['mac','AppKit']])}</div>
<div class="ctl"><span>Thème</span>${seg('t',[['light','Clair'],['dark','Sombre']])}</div>
<div class="ctl"><span>Langue</span>${seg('lang',[['fr','FR'],['en','EN']])}</div>
<div class="ctl"><span>État</span>${seg('state',states())}</div><span class="hint">Clavier : 1 à 9 puis 0 écrans, P plateforme, D thème, L langue, S état suivant.</span>`;}
function fit(){const w=document.getElementById('wrap');if(w)w.style.zoom=Math.min(1,(innerWidth-40)/1200);}
function sync(){const q=new URLSearchParams();for(const k of ['screen','p','t','lang','state'])q.set(k,S[k]);history.replaceState(null,'','?'+q.toString());}
function render(){if(!states().some(([k])=>k===S.state))S.state=states()[0][0];
  controls();document.getElementById('wrap').innerHTML=stage();
  document.getElementById('notes').innerHTML=NOTES[S.screen]+`<p class="hint" style="margin-top:8px">${COVER[S.screen]}</p>`;fit();sync();}
/* planches pour les captures PNG : [écran, état, plateforme, thème, légende] */
const SHEET_MAIN=[['overlay','select','adw','light','Overlay'],['overlay','select','adw','dark','Overlay'],['overlay','edge','adw','light','Overlay · bord et petite zone'],['editor','sent','adw','light','Éditeur · libadwaita · envoyée'],
 ['editor','default','adw','light','Éditeur · libadwaita'],['editor','default','adw','dark','Éditeur · libadwaita'],['editor','default','mac','light','Éditeur · AppKit'],['editor','default','mac','dark','Éditeur · AppKit']];
const SHEET_RES=[['resident','kde','adw','light','Résident · KDE Plasma'],['resident','gnome','adw','light','Résident · GNOME (lanceur)'],['resident','menu','mac','light','Résident · macOS, menu de la barre'],['resident','menubar','mac','dark','macOS · barre de menus de l’application']];
function renderSheet(cells,title){document.body.classList.add('sheetmode');let h='';
  for(const [sc,st,p,t,l] of cells){Object.assign(S,{screen:sc,state:st,p,t});h+=`<figure class="cell"><figcaption>${l} · ${t==='light'?'clair':'sombre'} · ${S.lang.toUpperCase()}</figcaption>${stage()}</figure>`;}
  document.getElementById('main').innerHTML=`<div class="sheet" id="sheet"><h2>kropa · ${title} <small>docs/design/mockups.html · D2.3 révisé</small></h2>${h}</div>`;}
document.addEventListener('click',e=>{const b=e.target.closest('button[data-k]');if(!b)return;S[b.dataset.k]=b.dataset.v;if(b.dataset.k==='screen')S.state=STATES[S.screen][0][0];render();});
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey||document.body.classList.contains('sheetmode'))return;const k=e.key.toLowerCase();
  if(/^[0-9]$/.test(k)){const i=k==='0'?9:+k-1;if(!SCREENS[i])return;S.screen=SCREENS[i][0];S.state=STATES[S.screen][0][0];}
  else if(k==='p')S.p=S.p==='adw'?'mac':'adw';else if(k==='d')S.t=S.t==='light'?'dark':'light';else if(k==='l')S.lang=S.lang==='fr'?'en':'fr';
  else if(k==='s'){const L=states(),i=L.findIndex(([v])=>v===S.state);S.state=L[(i+1)%L.length][0];}else return;render();});
addEventListener('resize',fit);
(function init(){const q=new URLSearchParams(location.search);for(const k of ['screen','p','t','lang','state'])if(q.get(k))S[k]=q.get(k);
  if(!SCR[S.screen])S.screen='overlay';
  if(q.has('resident'))renderSheet(SHEET_RES,'menu résident et lanceur');else if(q.has('sheet'))renderSheet(SHEET_MAIN,'maquettes principales');else render();})();
</script>
